[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contaflux"
version = "1.0.0"
description = "Conta veículos e pessoas que cruzam uma linha em vídeo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-xdist>=3.5"]

[project.scripts]
contaflux = "contaflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["lento: testes que processam vídeo inteiro"]

[tool.coverage.run]
source = ["src/contaflux"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
