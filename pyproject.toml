[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contaflux"
version = "1.0.0"
description = "Conta veículos que cruzam uma linha em vídeo de câmera fixa"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-xdist>=3.5"]

[project.scripts]
contaflux = "contaflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["lento: processa uma cena inteira de vídeo, quadro a quadro"]

[tool.coverage.run]
source = ["src/contaflux"]
branch = true
omit = [
    # Empacotamento, e não código do sistema: leva minutos, depende do sistema
    # operacional e produz um arquivo de mais de cem megabytes.
    "*/empacotar.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: sem cobertura",
    "if __name__ == .__main__.:",
    # A janela ao vivo depende de servidor gráfico e de alguém apertando tecla.
    # Testar isso exigiria simular o ambiente de janela inteiro, e o que ela faz
    # de fato, que é anotar o quadro, é testado em test_desenho.py.
    "if mostrar:",
]
