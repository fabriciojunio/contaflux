name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # O opencv-python traz a interface gráfica, que precisa destas bibliotecas
      # do sistema mesmo quando nenhuma janela é aberta. Sem elas, o import do
      # cv2 falha no runner e a suíte inteira nem chega a começar.
      - name: Bibliotecas de sistema do OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # A suíte processa dezenas de milhares de quadros de vídeo, e em série
      # isso passa de meia hora. Um processo por núcleo do runner resolve.
      - name: Rodar a suíte
        run: pytest -n auto --cov=contaflux --cov-report=term-missing
